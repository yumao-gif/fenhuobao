<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>分货宝 - 天气预警</title>
<style>
*,*::before,*::after{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%;width:100%;overflow:hidden;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;background:#1a1a2e;color:#FFFFFF;-webkit-font-smoothing:antialiased}
#app{display:flex;flex-direction:column;height:100vh;height:100dvh;width:100%;max-width:480px;margin:0 auto;background:linear-gradient(180deg,#1a1a2e 0%,#16213e 55%,#0f3460 100%);position:relative;overflow:hidden}
.page-content{flex:1;overflow-y:auto;-webkit-overflow-scrolling:touch;padding:0;scrollbar-width:none}
.page-content::-webkit-scrollbar{display:none}

/* ===== TV Weather Style ===== */
.tv-header{background:transparent;padding:64px 20px 12px;position:relative;z-index:10;border-bottom:1px solid rgba(255,255,255,0.08)}
.tv-city{font-size:28px;font-weight:800;margin-bottom:4px;color:#FFFFFF}
.tv-update{font-size:13px;color:rgba(255,255,255,0.65);margin-bottom:16px}

.tv-current{display:flex;align-items:center;gap:20px;margin-bottom:16px}
.tv-current-icon{width:72px;height:72px;background:rgba(255,255,255,0.1);border-radius:50%;display:flex;align-items:center;justify-content:center}
.tv-current-icon svg{width:48px;height:48px}
.tv-current-info{flex:1}
.tv-current-temp{font-size:48px;font-weight:800;line-height:1;margin-bottom:4px;color:#FFFFFF}
.tv-current-temp span{font-size:24px;font-weight:400;color:rgba(255,255,255,0.55)}
.tv-current-weather{font-size:18px;font-weight:600;margin-bottom:8px;color:#FFFFFF}
.tv-current-meta{display:flex;gap:16px;font-size:14px;color:rgba(255,255,255,0.75)}
.tv-current-meta span{display:flex;align-items:center;gap:4px}
.tv-current-meta svg{width:16px;height:16px;stroke:rgba(255,255,255,0.8);stroke-width:2;fill:none}

.tv-aqi{display:inline-flex;align-items:center;gap:6px;background:rgba(255,255,255,0.12);padding:6px 14px;border-radius:20px;font-size:13px;color:#FFFFFF}
.tv-aqi-dot{width:8px;height:8px;border-radius:50%;background:#4CAF50}
.tv-aqi-dot.yellow{background:#FFC107}
.tv-aqi-dot.orange{background:#FF9800}
.tv-aqi-dot.red{background:#F44336}

/* ===== Warning Banner ===== */
.tv-warning{background:rgba(255,255,255,0.08);margin:0 16px 16px;padding:14px 16px;border-radius:16px;display:flex;align-items:center;gap:12px;box-shadow:0 2px 12px rgba(0,0,0,0.15);border-left:4px solid #F5A623}
@keyframes pulse{0%,100%{box-shadow:0 2px 12px rgba(0,0,0,0.15)}50%{box-shadow:0 2px 16px rgba(0,0,0,0.25)}}
.tv-warning svg{width:28px;height:28px;stroke:#F5A623;stroke-width:2;fill:none;flex-shrink:0}
.tv-warning-text{font-size:15px;font-weight:600;line-height:1.4;color:#FFFFFF}

/* ===== 7-Day Forecast ===== */
.forecast-section{padding:0 16px 16px}
.forecast-title{font-size:18px;font-weight:700;margin-bottom:16px;display:flex;align-items:center;gap:8px;color:#FFFFFF}
.forecast-title svg{width:22px;height:22px;stroke:rgba(255,255,255,0.8);stroke-width:2;fill:none}

.forecast-list{display:flex;flex-direction:column;gap:10px}

.forecast-card{background:rgba(255,255,255,0.08);border-radius:16px;padding:16px;display:flex;align-items:center;gap:14px;border:1px solid rgba(255,255,255,0.1);transition:all .3s;box-shadow:0 2px 12px rgba(0,0,0,0.15)}
.forecast-card:active{background:rgba(255,255,255,0.12);transform:scale(0.98)}

.forecast-day{flex-shrink:0;width:72px}
.forecast-day-name{font-size:14px;font-weight:600;margin-bottom:2px;color:#FFFFFF}
.forecast-day-date{font-size:12px;color:rgba(255,255,255,0.55)}

.forecast-icon{width:56px;height:56px;border-radius:50%;display:flex;align-items:center;justify-content:center;flex-shrink:0}
.forecast-icon svg{width:32px;height:32px}
.forecast-icon.sunny{background:linear-gradient(135deg,#FFD54F,#FF8F00)}
.forecast-icon.cloudy{background:linear-gradient(135deg,#90A4AE,#546E7A)}
.forecast-icon.rainy{background:linear-gradient(135deg,#42A5F5,#1565C0)}
.forecast-icon.heavy-rain{background:linear-gradient(135deg,#5C6BC0,#283593)}
.forecast-icon.thunder{background:linear-gradient(135deg,#7E57C2,#4527A0)}

.forecast-info{flex:1;min-width:0}
.forecast-temp{font-size:28px;font-weight:800;line-height:1;margin-bottom:4px;color:#FFFFFF}
.forecast-temp span{font-size:16px;font-weight:400;color:rgba(255,255,255,0.55)}
.forecast-weather{font-size:15px;font-weight:600;margin-bottom:6px;color:#FFFFFF}
.forecast-impact{font-size:13px;color:rgba(255,255,255,0.55);line-height:1.4}
.forecast-impact.alert{color:#F5A623;font-weight:600}

/* ===== Summary ===== */
.tv-summary{background:rgba(255,255,255,0.08);margin:0 16px 16px;padding:20px;border-radius:16px;border:1px solid rgba(255,255,255,0.1);box-shadow:0 2px 12px rgba(0,0,0,0.15)}
.tv-summary-title{font-size:17px;font-weight:700;color:#FFFFFF;margin-bottom:12px;display:flex;align-items:center;gap:8px}
.tv-summary-title svg{width:20px;height:20px;stroke:#FFFFFF;stroke-width:2;fill:none}
.tv-summary-text{font-size:15px;line-height:1.8;color:rgba(255,255,255,0.8)}
.tv-summary-text strong{color:#F5A623}

/* ===== Data Source ===== */
.data-source{text-align:center;padding:0 16px 80px;font-size:12px;color:rgba(255,255,255,0.5)}

/* ===== Loading ===== */
.tv-loading{display:flex;flex-direction:column;align-items:center;justify-content:center;padding:80px 20px}
.tv-loading-spinner{width:48px;height:48px;border:3px solid rgba(255,255,255,0.2);border-top-color:#FFFFFF;border-radius:50%;animation:spin 1s linear infinite;margin-bottom:16px}
@keyframes spin{to{transform:rotate(360deg)}}
.tv-loading-text{font-size:16px;color:rgba(255,255,255,0.8)}

/* ===== Back Button ===== */
.back-btn{position:absolute;top:16px;left:16px;z-index:100;width:36px;height:36px;border-radius:50%;background:rgba(255,255,255,0.15);display:flex;align-items:center;justify-content:center;cursor:pointer;box-shadow:0 2px 12px rgba(0,0,0,0.25)}
.back-btn svg{width:20px;height:20px;stroke:#FFFFFF;stroke-width:2;fill:none}

/* ===== Decorative Elements ===== */
.tv-deco{position:absolute;top:0;right:0;width:200px;height:200px;background:radial-gradient(circle,rgba(255,255,255,0.06) 0%,transparent 70%);pointer-events:none;z-index:1}

/* ===== Tab Bar ===== */
#tab-bar{height:56px;background:rgba(26,26,46,0.95);border-top:1px solid rgba(255,255,255,0.08);display:flex;align-items:center;justify-content:space-around;flex-shrink:0;position:fixed;bottom:0;left:50%;transform:translateX(-50%);width:100%;max-width:480px;z-index:998}
.tab-item{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;cursor:pointer;padding:4px 0;text-decoration:none;position:relative;-webkit-tap-highlight-color:transparent}
.tab-icon-wrap{width:24px;height:24px;display:flex;align-items:center;justify-content:center;transition:all .2s}
.tab-item.active .tab-icon-wrap{background:rgba(91,174,138,0.12);border-radius:50%;width:32px;height:32px}
.tab-icon{width:24px;height:24px;stroke:#7A8C83;stroke-width:1.8;fill:none;stroke-linecap:round;stroke-linejoin:round;transition:all .2s}
.tab-item.active .tab-icon{width:20px;height:20px;stroke:#5BAE8A}
.tab-label{font-size:11px;color:#7A8C83;transition:color .2s;font-weight:500}
.tab-item.active .tab-label{color:#5BAE8A;font-weight:600}
</style>
</head>
<body>
<div id="app">
  <div class="tv-deco"></div>
  <div class="back-btn" onclick="history.back()">
    <svg viewBox="0 0 24 24"><polyline points="15 18 9 12 15 6"/></svg>
  </div>

  <div class="page-content" id="weather-content">
    <div class="tv-loading" id="loading">
      <div class="tv-loading-spinner"></div>
      <div class="tv-loading-text">正在连接气象局...</div>
    </div>

    <div id="weather-data" style="display:none">
      <div class="tv-header">
        <div class="tv-city" id="city-name">开封市</div>
        <div class="tv-update" id="update-time">刚刚更新</div>

        <div class="tv-current">
          <div class="tv-current-icon" id="current-icon"></div>
          <div class="tv-current-info">
            <div class="tv-current-temp"><span id="current-temp">--</span><span>°C</span></div>
            <div class="tv-current-weather" id="current-weather">--</div>
            <div class="tv-current-meta">
              <span><svg viewBox="0 0 24 24"><path d="M12 2v20M17 5H9.5a3.5 3.5 0 0 0 0 7h5a3.5 3.5 0 0 1 0 7H6"/></svg><span id="current-humidity">--%</span></span>
              <span><svg viewBox="0 0 24 24"><path d="M9.59 4.59A2 2 0 1 1 11 8H2m10.59 11.41A2 2 0 1 0 14 16H2m15.73-8.27A2.5 2.5 0 1 1 19.5 12H2"/></svg><span id="current-wind">--级</span></span>

          未来7天预报

      <div class="tv-summary" id="summary-card">

  <div id="tab-bar">

      <div class="tab-icon-wrap">

</div>

<script>
(function(){
  // 读取当前城市（首页手动定位存到这里）
  var CITY_NAME = localStorage.getItem('userCity') || '延安市';

  // 北京天气参考数据（写死，不区分城市）
  var WEATHER_DATA = {
    updated: '2026-10-02 10:00',
    current: { temp: 20, text: '多云', aqi: 85, humidity: 50, wind: '3级' },
    daily: [
      { date: '10月2日', text: '晴', tempMax: 24, tempMin: 12, impact: '天气不错，适合采收' },
      { date: '10月3日', text: '多云', tempMax: 23, tempMin: 13, impact: '天气不错，适合采收' },
      { date: '10月4日', text: '小雨', tempMax: 20, tempMin: 14, impact: '有雨，不适合采收' },
      { date: '10月5日', text: '中雨', tempMax: 18, tempMin: 13, impact: '大雨，注意防涝' },
      { date: '10月6日', text: '多云', tempMax: 21, tempMin: 12, impact: '天气转好，适合采收' },
      { date: '10月7日', text: '晴', tempMax: 25, tempMin: 14, impact: '天气不错，适合采收' },
      { date: '10月8日', text: '晴', tempMax: 26, tempMin: 15, impact: '天气不错，适合采收' }
    ]
  };

  // ========== 天气图标SVG ==========
  var ICONS = {
    sunny: '<svg viewBox="0 0 24 24" stroke="#fff" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="5"/><path d="M12 1v2"/><path d="M12 21v2"/><path d="M4.22 4.22l1.42 1.42"/><path d="M18.36 18.36l1.42 1.42"/><path d="M1 12h2"/><path d="M21 12h2"/><path d="M4.22 19.78l1.42-1.42"/><path d="M18.36 5.64l1.42-1.42"/></svg>',
    cloudy: '<svg viewBox="0 0 24 24" stroke="#fff" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round"><path d="M18 10h-1.26A8 8 0 1 0 9 20h9a5 5 0 0 0 0-10z"/></svg>',
    'partly-cloudy': '<svg viewBox="0 0 24 24" stroke="#fff" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round"><path d="M18 10h-1.26A8 8 0 1 0 9 20h9a5 5 0 0 0 0-10z"/><circle cx="18" cy="6" r="3"/></svg>',
    rainy: '<svg viewBox="0 0 24 24" stroke="#fff" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round"><path d="M16 13v6"/><path d="M8 13v6"/><path d="M12 15v6"/><path d="M20 16.2A4.5 4.5 0 0 0 3.2 14.2A5.5 5.5 0 0 0 13 18.9"/></svg>',
    'heavy-rain': '<svg viewBox="0 0 24 24" stroke="#fff" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round"><path d="M16 13v8"/><path d="M8 13v8"/><path d="M12 15v8"/><path d="M20 16.2A4.5 4.5 0 0 0 3.2 14.2A5.5 5.5 0 0 0 13 18.9"/><path d="M16 17v2"/><path d="M8 17v2"/></svg>',
    thunder: '<svg viewBox="0 0 24 24" stroke="#fff" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round"><path d="M19 16.9A5 5 0 0 0 18 7h-1.26a8 8 0 1 0-11.62 9"/><polyline points="13 11 9 17 15 17 11 23"/></svg>',
    snow: '<svg viewBox="0 0 24 24" stroke="#fff" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round"><path d="M20 17.58A5 5 0 0 0 18 8h-1.26A8 8 0 1 0 4 16.25"/><line x1="8" y1="16" x2="8.01" y2="16"/><line x1="8" y1="20" x2="8.01" y2="20"/><line x1="12" y1="18" x2="12.01" y2="18"/><line x1="12" y1="22" x2="12.01" y2="22"/><line x1="16" y1="16" x2="16.01" y2="16"/><line x1="16" y1="20" x2="16.01" y2="20"/></svg>',
    fog: '<svg viewBox="0 0 24 24" stroke="#fff" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round"><path d="M4 15h16"/><path d="M4 9h16"/><path d="M4 12h16"/></svg>'
  };

  // ========== 天气代码映射到类型（增强文本识别，支持无 code 的数据） ==========
  function getWeatherType(code, text){
    if(text){
      if(text.indexOf('晴') >= 0 && text.indexOf('多云') < 0 && text.indexOf('阴') < 0) return 'sunny';
      if(text.indexOf('多云') >= 0) return 'partly-cloudy';
      if(text.indexOf('阴') >= 0) return 'cloudy';
      if(text.indexOf('小雨') >= 0) return 'rainy';
      if(text.indexOf('中雨') >= 0 || text.indexOf('大雨') >= 0 || text.indexOf('暴雨') >= 0) return 'heavy-rain';
      if(text.indexOf('雨') >= 0) return 'rainy';
      if(text.indexOf('雪') >= 0) return 'snow';
      if(text.indexOf('雷') >= 0) return 'thunder';
      if(text.indexOf('雾') >= 0 || text.indexOf('霾') >= 0) return 'fog';
    }
    code = parseInt(code);
    if(code >= 200 && code < 300) return 'thunder';
    if((code >= 300 && code < 400) || (code >= 500 && code < 600)){
      if(code >= 305 && code <= 310) return 'heavy-rain';
      return 'rainy';
    }
    if(code >= 400 && code < 500) return 'snow';
    if(code >= 500 && code < 600){
      if(text && (text.indexOf('雾')>=0 || text.indexOf('霾')>=0)) return 'fog';
      return 'fog';
    }
    if(code === 100) return 'sunny';
    if(code === 101 || code === 102 || code === 103) return 'partly-cloudy';
    if(code >= 100 && code < 200) return 'cloudy';
    return 'cloudy';
  }

  // ========== 获取中文星期 ==========
  function getWeekday(date){
    var days = ['周日','周一','周二','周三','周四','周五','周六'];
    return days[date.getDay()];
  }

  // ========== 农业影响建议 ==========
  function getImpact(weatherType, tempMax, tempMin, text, precomputed){
    if(precomputed){
      var isAlert = precomputed.indexOf('雨') >= 0 || precomputed.indexOf('涝') >= 0 || precomputed.indexOf('雷') >= 0 || precomputed.indexOf('不适合') >= 0;
      return {text: precomputed, alert: isAlert};
    }
    if(weatherType === 'thunder'){
      return {text:'打雷下雨，千万别去地里，安全第一', alert:true};
    }
    if(weatherType === 'heavy-rain'){
      return {text:'大雨，不适合采收，路上会烂掉很多', alert:true};
    }
    if(weatherType === 'rainy'){
      return {text:'有雨，采收时要盖严实，别让货淋湿', alert:true};
    }
    if(weatherType === 'snow'){
      return {text:'下雪，注意防冻，大棚要加固', alert:true};
    }
    if(tempMax > 35){
      return {text:'高温，注意给地里浇水，别旱着', alert:false};
    }
    if(tempMax > 32){
      return {text:'天热点，注意保湿', alert:false};
    }
    if(tempMin < 0){
      return {text:'低温，注意防冻，夜里盖棚', alert:true};
    }
    if(tempMin < 5){
      return {text:'温度低，注意保暖', alert:false};
    }
    return {text:'天气不错，适合采收', alert:false};
  }

  // ========== AQI等级 ==========
  function getAqiInfo(aqi){
    aqi = parseInt(aqi);
    if(aqi <= 50) return {level:'优', color:'#4CAF50', class:'', text:'空气好'};
    if(aqi <= 100) return {level:'良', color:'#FFC107', class:'yellow', text:'空气还行'};
    if(aqi <= 150) return {level:'轻度污染', color:'#FF9800', class:'orange', text:'有点雾霾'};
    if(aqi <= 200) return {level:'中度污染', color:'#F44336', class:'red', text:'雾霾较重'};
    return {level:'重度污染', color:'#9C27B0', class:'red', text:'雾霾严重'};
  }

  // ========== 转换写死数据为 render 所需格式 ==========
  function convertData(raw){
    var today = new Date();
    return {
      current: {
        temp: raw.current.temp,
        weather: raw.current.text,
        code: null,
        humidity: raw.current.humidity,
        windScale: parseInt(raw.current.wind) || 3,
        aqi: raw.current.aqi
      },
      daily: raw.daily.map(function(d, i){
        var dt = new Date(today);
        dt.setDate(today.getDate() + i);
        return {
          fxDate: dt.getFullYear() + '-' + String(dt.getMonth()+1).padStart(2,'0') + '-' + String(dt.getDate()).padStart(2,'0'),
          date: d.date,
          weekday: i === 0 ? '今天' : getWeekday(dt),
          textDay: d.text,
          tempMax: d.tempMax,
          tempMin: d.tempMin,
          code: null,
          impact: d.impact
        };
      }),
      warning: []
    };
  }

  // ========== 渲染页面 ==========
  function render(data){
    // 顶部当前天气
    document.getElementById('city-name').textContent = CITY_NAME;
    document.getElementById('current-temp').textContent = data.current.temp;
    document.getElementById('current-weather').textContent = data.current.weather;
    document.getElementById('current-humidity').textContent = (data.current.humidity || '--') + '%';
    document.getElementById('current-wind').textContent = (data.current.windScale || '--') + '级';
    document.getElementById('update-time').textContent = '真实数据 · ' + WEATHER_DATA.updated + ' 更新';

    // 当前天气图标
    var currentType = getWeatherType(data.current.code, data.current.weather);
    document.getElementById('current-icon').innerHTML = ICONS[currentType] || ICONS.cloudy;

    // AQI
    var aqi = data.current.aqi || 85;
    var aqiInfo = getAqiInfo(aqi);
    document.getElementById('aqi-text').textContent = 'AQI ' + aqi + ' ' + aqiInfo.level + ' · ' + aqiInfo.text;
    document.getElementById('aqi-dot').className = 'tv-aqi-dot ' + aqiInfo.class;

    // 预警信息
    if(data.warning && data.warning.length > 0){
      var w = data.warning[0];
      document.getElementById('warning-text').textContent = w.title || '气象预警：请注意防范';
      document.getElementById('warning-banner').style.display = 'flex';
    } else {
      // 检查是否有雨天，自动生成预警
      var rainDays = data.daily.filter(function(d){return d.textDay.indexOf('雨') >= 0;});
      if(rainDays.length >= 3){
        document.getElementById('warning-text').textContent = '未来' + rainDays.length + '天有雨，注意采收安排';
        document.getElementById('warning-banner').style.display = 'flex';
      }
    }

    // 7天预报
    var list = document.getElementById('forecast-list');
    var html = '';
    for(var i=0; i < data.daily.length; i++){
      var d = data.daily[i];
      var type = getWeatherType(d.code, d.textDay);
      var impact = getImpact(type, d.tempMax, d.tempMin, d.textDay, d.impact);
      var alertClass = impact.alert ? ' alert' : '';

      html += '<div class="forecast-card">';
      html += '<div class="forecast-day">';
      html += '<div class="forecast-day-name">' + d.weekday + '</div>';
      html += '<div class="forecast-day-date">' + d.date + '</div>';
      html += '</div>';
      html += '<div class="forecast-icon ' + type + '">' + (ICONS[type] || ICONS.cloudy) + '</div>';
      html += '<div class="forecast-info">';
      html += '<div class="forecast-temp">' + d.tempMax + '<span>&deg; / ' + d.tempMin + '&deg;</span></div>';
      html += '<div class="forecast-weather">' + d.textDay + '</div>';
      html += '<div class="forecast-impact' + alertClass + '">' + impact.text + '</div>';
      html += '</div></div>';
    }
    list.innerHTML = html;

    // 总结建议
    var rainDays = data.daily.filter(function(d){return d.textDay.indexOf('雨') >= 0;});
    var rainDates = rainDays.map(function(d){return d.date;}).slice(0,3);
    var summary = '';
    if(rainDays.length >= 3){
      summary = '未来' + rainDays.length + '天有雨（' + rainDates.join('、') + '），建议<strong>提前采收或优先卖给贩子</strong>，别等烂地里。';
    } else if(rainDays.length > 0){
      summary = '未来' + rainDays.length + '天有雨，采收时<strong>盖严实点</strong>，别让货淋湿。';
    } else {
      summary = '未来7天基本都是好天，<strong>放心采收</strong>，自己拉去市场卖更合适。';
    }
    document.getElementById('summary-text').innerHTML = summary;

    // 数据来源
    document.getElementById('data-source').textContent = '数据来源：北京气象参考数据';

    // 显示内容
    document.getElementById('loading').style.display = 'none';
    document.getElementById('weather-data').style.display = 'block';
  }

  // ========== 启动 ==========
  var converted = convertData(WEATHER_DATA);
  render(converted);
})();
</script>
</body>
</html>
