<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>分货宝 - 附近收购点</title>
  <script src="https://api.map.baidu.com/api?v=3.0&ak=5d7lkXXln9va4PmJcNBsL55sIijOtYYE"></script>
<style>
*,*::before,*::after{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%;width:100%;overflow:hidden;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;background:#F5F9F6;color:#1F2D28;-webkit-font-smoothing:antialiased}
#app{display:flex;flex-direction:column;height:100vh;height:100dvh;width:100%;max-width:480px;margin:0 auto;background:#F5F9F6;position:relative;overflow:hidden}
.page-content{flex:1;overflow-y:auto;-webkit-overflow-scrolling:touch;padding:16px;padding-bottom:72px;scrollbar-width:none}
.page-content::-webkit-scrollbar{display:none}

/* Header */
.page-header{display:flex;align-items:center;gap:12px;padding:4px 0 16px}
.back-btn{width:36px;height:36px;border-radius:50%;background:#fff;display:flex;align-items:center;justify-content:center;cursor:pointer;box-shadow:0 1px 4px rgba(91,174,138,0.08);text-decoration:none;color:#1F2D28}
.back-btn svg{width:18px;height:18px;stroke:#5BAE8A;stroke-width:2;fill:none}
.page-title{font-size:18px;font-weight:700;color:#1F2D28;flex:1}

/* Search bar + refresh */
.search-row{display:flex;gap:8px;margin-bottom:12px}
.search-bar{flex:1;background:#FFFFFF;border-radius:16px;padding:12px 16px;display:flex;align-items:center;gap:10px;box-shadow:0 1px 6px rgba(91,174,138,0.08)}
.search-bar svg{width:18px;height:18px;stroke:#7A8C83;stroke-width:2;fill:none;flex-shrink:0}
.search-bar input{flex:1;border:none;outline:none;font-size:15px;color:#1F2D28;background:transparent}
.search-bar input::placeholder{color:#7A8C83}
.refresh-btn{width:44px;height:44px;border-radius:50%;background:#5BAE8A;color:#FFFFFF;display:flex;align-items:center;justify-content:center;cursor:pointer;border:none;flex-shrink:0}
.refresh-btn svg{width:20px;height:20px;stroke:#fff;stroke-width:2;fill:none;stroke-linecap:round;stroke-linejoin:round}

/* Location hint */
.loc-hint{font-size:13px;color:#7A8C83;margin-bottom:12px;display:flex;align-items:center;gap:6px}
.loc-hint svg{width:14px;height:14px;stroke:#5BAE8A;stroke-width:2;fill:none}

/* Point Card */
.point-card{background:#fff;border-radius:16px;padding:16px 20px;box-shadow:0 2px 12px rgba(91,174,138,0.08);margin-bottom:12px}
.point-header{display:flex;align-items:flex-start;gap:12px;margin-bottom:12px}
.point-icon{width:44px;height:44px;border-radius:12px;background:#F5F9F6;display:flex;align-items:center;justify-content:center;flex-shrink:0}
.point-icon svg{width:22px;height:22px;stroke:#5BAE8A;stroke-width:2;fill:none}
.point-info{flex:1}
.point-name{font-size:16px;font-weight:600;color:#1F2D28;margin-bottom:4px}
.point-tags{display:flex;gap:6px;flex-wrap:wrap}
.point-tag{font-size:11px;padding:3px 10px;border-radius:20px;background:#F5F9F6;color:#7A8C83;font-weight:500}
.point-tag.price{background:#F5F9F6;color:#5BAE8A}
.point-tag.cash{background:#FFF8E1;color:#F5A623}
.point-tag.volume{background:#F5F9F6;color:#5BAE8A}

.point-details{display:flex;flex-direction:column;gap:8px;margin-bottom:12px}
.point-row{display:flex;align-items:center;gap:8px;font-size:14px;color:#7A8C83}
.point-row svg{width:16px;height:16px;stroke:#7A8C83;stroke-width:1.8;fill:none;flex-shrink:0}
.point-row .label{color:#7A8C83;white-space:nowrap}
.point-row .value{color:#1F2D28;font-weight:500;flex:1}

.nav-btn{display:flex;align-items:center;justify-content:center;width:100%;height:44px;border:none;border-radius:24px;background:#5BAE8A;color:#FFFFFF;font-size:15px;font-weight:600;text-decoration:none;cursor:pointer}
.nav-btn:active{opacity:0.9}

.footer-note{font-size:12px;color:#7A8C83;text-align:center;padding:16px 20px;line-height:1.6}

/* Tab Bar */
#tab-bar{height:56px;background:#fff;border-top:1px solid #E8F0EB;display:flex;align-items:center;justify-content:space-around;flex-shrink:0;position:fixed;bottom:0;left:50%;transform:translateX(-50%);width:100%;max-width:480px;z-index:998}
.tab-item{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;cursor:pointer;padding:4px 0;text-decoration:none;position:relative}
.tab-icon-wrap{width:24px;height:24px;display:flex;align-items:center;justify-content:center;transition:all .2s}
.tab-item.active .tab-icon-wrap{background:rgba(91,174,138,0.12);border-radius:50%;width:32px;height:32px}
.tab-icon{width:24px;height:24px;stroke:#7A8C83;stroke-width:1.8;fill:none;stroke-linecap:round;stroke-linejoin:round;transition:all .2s}
.tab-item.active .tab-icon{width:20px;height:20px;stroke:#5BAE8A}
.tab-label{font-size:11px;color:#7A8C83;transition:color .2s;font-weight:500}
.tab-item.active .tab-label{color:#5BAE8A;font-weight:600}
</style>
</head>
<body>
<div id="app">
  <div class="page-content">
    <div class="page-header">
      <a class="back-btn" href="service.html">
        <svg viewBox="0 0 24 24"><polyline points="15 18 9 12 15 6"/></svg>
      </a>
      <div class="page-title">附近收购点</div>
    </div>

    <div class="search-row">
      <div class="search-bar">
        <svg viewBox="0 0 24 24"><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>
        <input type="text" placeholder="输入地区或收购点名称搜索…" id="search-input" oninput="filterPoints()"/>
      </div>
      <button class="refresh-btn" onclick="refreshAndRender()" title="刷新位置">
        <svg viewBox="0 0 24 24"><polyline points="23 4 23 10 17 10"/><path d="M20.49 15a9 9 0 1 1-2.12-9.36L23 10"/></svg>
      </button>
    </div>

    <div class="loc-hint" id="loc-hint">
      <svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="3"/><path d="M12 2v4M12 18v4M2 12h4M18 12h4"/></svg>
      <span id="loc-text">📍 当前城市：<span id="city-name">正在读取…</span></span>
    </div>

    <div id="points-loading" style="text-align:center;padding:40px 20px;color:#7A8C83;font-size:14px">正在加载附近收购点…</div>
    <div id="points-list" style="display:none"></div>
    <div id="points-source" class="footer-note" style="display:none"></div>
  </div>

  <div id="tab-bar">
    <a class="tab-item" href="index.html">
      <div class="tab-icon-wrap">
        <svg class="tab-icon" viewBox="0 0 24 24"><rect x="5" y="3" width="14" height="18" rx="2"/><line x1="8" y1="7" x2="16" y2="7"/><line x1="8" y1="11" x2="11" y2="11"/><line x1="14" y1="11" x2="16" y2="11"/><line x1="8" y1="15" x2="11" y2="15"/><line x1="14" y1="15" x2="16" y2="15"/></svg>
      </div>
      <div class="tab-label">算账</div>
    </a>
    <a class="tab-item" href="market.html">
      <div class="tab-icon-wrap">
        <svg class="tab-icon" viewBox="0 0 24 24"><polyline points="22 12 18 12 15 21 9 3 6 12 2 12"/></svg>
      </div>
      <div class="tab-label">行情</div>
    </a>
    <a class="tab-item" href="service.html">
      <div class="tab-icon-wrap">
        <svg class="tab-icon" viewBox="0 0 24 24"><rect x="2" y="2" width="9" height="9" rx="1"/><rect x="13" y="2" width="9" height="9" rx="1"/><rect x="13" y="13" width="9" height="9" rx="1"/><rect x="2" y="13" width="9" height="9" rx="1"/></svg>
      </div>
      <div class="tab-label">服务</div>
    </a>
    <a class="tab-item" href="profile.html">
      <div class="tab-icon-wrap">
        <svg class="tab-icon" viewBox="0 0 24 24"><path d="M20 21v-2a4 4 0 00-4-4H8a4 4 0 00-4 4v2"/><circle cx="12" cy="7" r="4"/></svg>
      </div>
      <div class="tab-label">我的</div>
    </a>
  </div>
</div>

<script>
(function(){
  var POINTS = [
    {
      name: '洛川县苹果收购市场',
      lat: 35.77, lng: 109.62,
      tags: ['苹果收购', '现金结算'],
      phone: '0911-1234567',
      address: '延安市洛川县凤栖街道中心街',
      navKeyword: '洛川县苹果收购市场'
    },
    {
      name: '延安市宝塔区农产品收购站',
      lat: 36.58, lng: 109.49,
      tags: ['蔬菜收购', '上门取货'],
      phone: '0911-8765432',
      address: '延安市宝塔区南桥街道市场沟',
      navKeyword: '延安市宝塔区农产品收购站'
    },
    {
      name: '富县农产品批发市场',
      lat: 36.00, lng: 109.37,
      tags: ['综合收购', '量大价优'],
      phone: '0911-3456789',
      address: '延安市富县茶坊街道正街',
      navKeyword: '富县农产品批发市场'
    },
    {
      name: '黄陵县苹果收购点',
      lat: 35.57, lng: 109.25,
      tags: ['苹果收购', '长期合作'],
      phone: '0911-5678901',
      address: '延安市黄陵县桥山街道梨园村',
      navKeyword: '黄陵县苹果收购点'
    },
    {
      name: '宜川县果蔬代收点',
      lat: 36.05, lng: 110.17,
      tags: ['果蔬代收', '现场结算'],
      phone: '0911-7890123',
      address: '延安市宜川县丹州街道南大街',
      navKeyword: '宜川县果蔬代收点'
    }
  ];

  var currentCity = '';

  function getUserCity() {
    var city = localStorage.getItem('userCity');
    if (!city) city = '北京市';
    return city;
  }

  function updateCityDisplay() {
    currentCity = getUserCity();
    var cityEl = document.getElementById('city-name');
    if (cityEl) cityEl.textContent = currentCity;
  }

  function formatDist(km) {
    if (km < 1) return (km * 1000).toFixed(0) + ' 米';
    return km.toFixed(1) + ' 公里';
  }

  function buildNavUrl(name) {
    var origin = encodeURIComponent(currentCity);
    var dest = encodeURIComponent(name);
    var region = encodeURIComponent(currentCity);
    return 'https://api.map.baidu.com/direction?origin=' + origin + '&destination=' + dest + '&mode=driving&region=' + region + '&output=html&src=webapp.分货宝';
  }

  function renderFallback() {
    var container = document.getElementById('points-list');
    var loading = document.getElementById('points-loading');
    var source = document.getElementById('points-source');
    var html = '';
    for (var i = 0; i < POINTS.length; i++) {
      var p = POINTS[i];
      var tagsHtml = '';
      for (var t = 0; t < p.tags.length; t++) {
        var cls = 'point-tag';
        if (p.tags[t].indexOf('元') >= 0) cls += ' price';
        else if (p.tags[t].indexOf('现金') >= 0) cls += ' cash';
        else if (p.tags[t].indexOf('优先') >= 0 || p.tags[t].indexOf('合作') >= 0) cls += ' volume';
        tagsHtml += '<span class="' + cls + '">' + p.tags[t] + '</span>';
      }
      var navUrl = buildNavUrl(p.navKeyword || p.name);
      html += '<div class="point-card" data-name="' + p.name + '">';
      html += '<div class="point-header">';
      html += '<div class="point-icon"><svg viewBox="0 0 24 24"><path d="M20 7h-9"/><path d="M14 17H5"/><circle cx="17" cy="17" r="3"/><circle cx="7" cy="7" r="3"/></svg></div>';
      html += '<div class="point-info"><div class="point-name">' + p.name + '</div>';
      html += '<div class="point-tags">' + tagsHtml + '</div></div></div>';
      html += '<div class="point-details">';
      html += '<div class="point-row"><svg viewBox="0 0 24 24"><path d="M21 10c0 7-9 13-9 13s-9-6-9-13a9 9 0 0 1 18 0z"/><circle cx="12" cy="10" r="3"/></svg><span class="label">地址：</span><span class="value">' + p.address + '</span></div>';
      html += '<div class="point-row"><svg viewBox="0 0 24 24"><path d="M22 16.92v3a2 2 0 0 1-2.18 2 19.8 19.8 0 0 1-8.63-3.07 19.5 19.5 0 0 1-6-6 19.8 19.8 0 0 1-3.07-8.67A2 2 0 0 1 4.11 2h3a2 2 0 0 1 2 1.72c.13 1.08.38 2.13.72 3.13a2 2 0 0 1-.45 2.11L8.09 9.91a16 16 0 0 0 6 6l1.27-1.27a2 2 0 0 1 2.11-.45c1 .34 2.05.59 3.13.72A2 2 0 0 1 22 16.92z"/></svg><span class="label">电话：</span><span class="value">' + (p.phone || '暂无电话') + '</span></div>';
      html += '</div>';
      html += '<a class="nav-btn" href="' + navUrl + '" target="_blank">一键导航</a>';
      html += '</div>';
    }
    container.innerHTML = html;
    container.style.display = 'block';
    source.textContent = '数据来源：百度地图搜索失败，已切换为参考数据';
    source.style.display = 'block';
    loading.style.display = 'none';
  }

  function renderRealResults(results) {
    var container = document.getElementById('points-list');
    var loading = document.getElementById('points-loading');
    var source = document.getElementById('points-source');
    if (!results || results.length === 0) {
      renderFallback();
      return;
    }
    var html = '';
    for (var i = 0; i < results.length && i < 20; i++) {
      var r = results[i];
      var name = r.title || '未知收购点';
      var address = r.address || '地址未知';
      var phone = r.phoneNumber || '暂无电话';
      var navUrl = buildNavUrl(name);
      html += '<div class="point-card" data-name="' + name + '">';
      html += '<div class="point-header">';
      html += '<div class="point-icon"><svg viewBox="0 0 24 24"><path d="M20 7h-9"/><path d="M14 17H5"/><circle cx="17" cy="17" r="3"/><circle cx="7" cy="7" r="3"/></svg></div>';
      html += '<div class="point-info"><div class="point-name">' + name + '</div>';
      html += '<div class="point-tags"><span class="point-tag price">百度地图</span></div></div></div>';
      html += '<div class="point-details">';
      html += '<div class="point-row"><svg viewBox="0 0 24 24"><path d="M21 10c0 7-9 13-9 13s-9-6-9-13a9 9 0 0 1 18 0z"/><circle cx="12" cy="10" r="3"/></svg><span class="label">地址：</span><span class="value">' + address + '</span></div>';
      html += '<div class="point-row"><svg viewBox="0 0 24 24"><path d="M22 16.92v3a2 2 0 0 1-2.18 2 19.8 19.8 0 0 1-8.63-3.07 19.5 19.5 0 0 1-6-6 19.8 19.8 0 0 1-3.07-8.67A2 2 0 0 1 4.11 2h3a2 2 0 0 1 2 1.72c.13 1.08.38 2.13.72 3.13a2 2 0 0 1-.45 2.11L8.09 9.91a16 16 0 0 0 6 6l1.27-1.27a2 2 0 0 1 2.11-.45c1 .34 2.05.59 3.13.72A2 2 0 0 1 22 16.92z"/></svg><span class="label">电话：</span><span class="value">' + phone + '</span></div>';
      html += '</div>';
      html += '<a class="nav-btn" href="' + navUrl + '" target="_blank">一键导航</a>';
      html += '</div>';
    }
    container.innerHTML = html;
    container.style.display = 'block';
    source.textContent = '数据来源：百度地图实时搜索（城市：' + currentCity + '）';
    source.style.display = 'block';
    loading.style.display = 'none';
  }

  function doSearch() {
    var q = document.getElementById('search-input').value.trim();
    if (!q) q = '农产品收购点';
    try {
      var map = new BMap.Map('hidden-map');
      var local = new BMap.LocalSearch(currentCity, {
        onSearchComplete: function(res) {
          if (local.getStatus() === BMAP_STATUS_SUCCESS && res && res.getNumPois && res.getNumPois() > 0) {
            var arr = [];
            var n = res.getNumPois();
            for (var i = 0; i < n && i < 20; i++) {
              var poi = res.getPoi(i);
              if (poi) arr.push(poi);
            }
            renderRealResults(arr);
          } else {
            renderFallback();
          }
        }
      });
      local.search(q);
    } catch (e) {
      renderFallback();
    }
  }

  function renderPoints() {
    updateCityDisplay();
    document.getElementById('points-loading').style.display = 'block';
    document.getElementById('points-list').style.display = 'none';
    // Wait for BMap API ready
    if (typeof BMap === 'undefined' || !BMap.Map) {
      setTimeout(function() {
        if (typeof BMap === 'undefined' || !BMap.Map) {
          renderFallback();
        } else {
          doSearch();
        }
      }, 2000);
      return;
    }
    doSearch();
  }

  function refreshAndRender() {
    document.getElementById('points-loading').style.display = 'block';
    document.getElementById('points-list').style.display = 'none';
    renderPoints();
  }

  window.refreshAndRender = refreshAndRender;
  window.filterPoints = function() { doSearch(); };

  // Initial render
  renderPoints();
})();
</script>
<div id="hidden-map" style="display:none"></div>
</body>
</html>
