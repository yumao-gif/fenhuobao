<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>分货宝 - 行情</title>
<style>
*,*::before,*::after{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%;width:100%;overflow:hidden;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;background:#F5F9F6;color:#1F2D28;-webkit-font-smoothing:antialiased}
#app{display:flex;flex-direction:column;height:100vh;height:100dvh;width:100%;max-width:480px;margin:0 auto;background:#F5F9F6;position:relative;overflow:hidden}
.page-content{flex:1;overflow-y:auto;-webkit-overflow-scrolling:touch;padding:16px;padding-bottom:72px;scrollbar-width:none}
.page-content::-webkit-scrollbar{display:none}

/* Tab Bar */
#tab-bar{height:56px;background:#fff;border-top:1px solid #E8F0EB;display:flex;align-items:center;justify-content:space-around;flex-shrink:0;position:fixed;bottom:0;left:50%;transform:translateX(-50%);width:100%;max-width:480px;z-index:998}
.tab-item{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;cursor:pointer;padding:4px 0;text-decoration:none;position:relative}
.tab-icon-wrap{width:24px;height:24px;display:flex;align-items:center;justify-content:center;transition:all .2s}
.tab-item.active .tab-icon-wrap{background:rgba(91,174,138,0.12);border-radius:50%;width:32px;height:32px}
.tab-icon{width:24px;height:24px;stroke:#7A8C83;stroke-width:1.8;fill:none;stroke-linecap:round;stroke-linejoin:round;transition:all .2s}
.tab-item.active .tab-icon{width:20px;height:20px;stroke:#5BAE8A}
.tab-label{font-size:11px;color:#7A8C83;transition:color .2s;font-weight:500}
.tab-item.active .tab-label{color:#5BAE8A;font-weight:600}

/* Page Header */
.page-header{display:flex;align-items:center;gap:10px;padding:4px 0 16px}
.page-header-title{font-size:18px;font-weight:700;color:#1F2D28}
.page-header-sub{font-size:13px;color:#7A8C83}

/* Section Card */
.section-card{background:#fff;border-radius:16px;padding:20px;box-shadow:0 2px 12px rgba(91,174,138,0.08);margin-bottom:16px}
.section-title{display:flex;align-items:center;gap:8px;font-size:16px;font-weight:600;color:#1F2D28;margin-bottom:16px}
.section-title svg{width:20px;height:20px;stroke:#5BAE8A;stroke-width:1.8;fill:none;stroke-linecap:round;stroke-linejoin:round}

/* Price Chart */
.chart-tabs{display:flex;gap:8px;margin-bottom:16px}
.chart-tab{font-size:13px;padding:6px 14px;border-radius:20px;background:#F5F9F6;color:#7A8C83;cursor:pointer;border:1px solid #E8F0EB;-webkit-tap-highlight-color:transparent}
.chart-tab.active{background:#5BAE8A;color:#fff;border-color:#5BAE8A}
.chart-svg-wrap{width:100%;position:relative}
.chart-svg{width:100%;height:auto;display:block}
.chart-price-now{display:flex;align-items:baseline;gap:6px;margin-bottom:12px}
.chart-price-val{font-size:32px;font-weight:800;color:#5BAE8A}
.chart-price-unit{font-size:14px;color:#7A8C83}
.chart-price-change{font-size:14px;font-weight:600;color:#F5A623;margin-left:8px}
.chart-legend{display:flex;flex-wrap:wrap;gap:12px;padding-top:12px;border-top:1px solid #E8F0EB;margin-top:12px;font-size:12px;color:#7A8C83}
.chart-legend span{display:flex;align-items:center;gap:4px}
.legend-dot{width:8px;height:8px;border-radius:50%;display:inline-block}
.legend-line{width:20px;height:2px;display:inline-block;border-radius:1px}

/* Weather Card */
.weather-warning{background:#FFFFFF;border-radius:16px;padding:16px 20px;margin-bottom:16px;display:flex;align-items:flex-start;gap:12px;border:1px solid #F5A623;box-shadow:0 2px 12px rgba(91,174,138,0.08)}
.weather-icon{width:40px;height:40px;border-radius:50%;background:#F5A623;display:flex;align-items:center;justify-content:center;flex-shrink:0}
.weather-icon svg{width:22px;height:22px;stroke:#fff;stroke-width:2;fill:none;stroke-linecap:round;stroke-linejoin:round}
.weather-text{flex:1}
.weather-title{font-size:15px;font-weight:600;color:#F5A623;margin-bottom:4px}
.weather-desc{font-size:13px;color:#7A8C83;line-height:1.5}

/* Supply/Demand */
.supply-item{display:flex;justify-content:space-between;align-items:center;padding:12px 0;border-bottom:1px solid #E8F0EB}
.supply-item:last-child{border-bottom:none}
.supply-label{font-size:14px;color:#1F2D28}
.supply-status{font-size:13px;font-weight:600;padding:4px 10px;border-radius:12px}
.supply-status.up{background:#F5F9F6;color:#5BAE8A}
.supply-status.down{background:#FFEBEE;color:#C62828}
.supply-status.flat{background:#F5F9F6;color:#7A8C83}
.supply-note{font-size:13px;color:#7A8C83;line-height:1.6;margin-top:12px;padding:12px;background:#F5F9F6;border-radius:8px}

/* Data source */
.data-source{font-size:12px;color:#7A8C83;text-align:center;padding:16px 0;line-height:1.6}
</style>
</head>
<body>
<div id="app">
  <div class="page-content">
    <div class="page-header">
      <div class="page-header-title">今日行情</div>
      <div class="page-header-sub">开封西瓜市场监测</div>
    </div>

    <!-- Price Trend Chart -->
    <div class="section-card">
      <div class="section-title">
        <svg viewBox="0 0 24 24"><polyline points="22 12 18 12 15 21 9 3 6 12 2 12"/></svg>
        价格走势
      </div>
      <div class="chart-tabs">
        <div class="chart-tab active" data-range="week">近7天</div>
        <div class="chart-tab" data-range="month">近30天</div>
        <div class="chart-tab" data-range="season">本季</div>
      </div>
      <div class="chart-price-now">
        <span class="chart-price-val" id="price-now">0.30</span>
        <span class="chart-price-unit">元/斤</span>
        <span class="chart-price-change" id="price-change">近7天价格趋势（数据积累中）</span>
      </div>
      <div class="chart-svg-wrap" id="chart-wrap"></div>
      <div class="chart-legend" id="chart-legend"></div>
    </div>

    <!-- Price Comparison Card -->
    <div id="comparison-card"></div>

    <!-- Weather Warning Card -->
    <div class="weather-warning" style="position:relative" onclick="window.location.href='weather.html'">
      <span style="position:absolute;top:12px;right:16px;font-size:11px;font-weight:600;color:#fff;background:#E53935;padding:3px 10px;border-radius:12px">影响采收</span>
      <div class="weather-icon" style="width:56px;height:56px;background:#5C6BC0">
        <svg viewBox="0 0 24 24" style="width:32px;height:32px"><path d="M20 16.2A4.5 4.5 0 0 0 3.2 14.2A5.5 5.5 0 0 0 13 18.9" stroke="#fff" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round"/><path d="M16 18v4" stroke="#fff" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round"/><path d="M13 20l3-3" stroke="#fff" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round"/><path d="M19 20l-3-3" stroke="#fff" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round"/><path d="M8 2C5 2 3 4 3 6c0 1 0.5 2 1.5 2.5" stroke="#fff" stroke-width="1.5" fill="none" stroke-linecap="round"/><path d="M12 2c-3 0-5 2-5 4" stroke="#fff" stroke-width="1.5" fill="none" stroke-linecap="round"/><path d="M16 2c-3 0-5 2-5 4" stroke="#fff" stroke-width="1.5" fill="none" stroke-linecap="round"/></svg>
      </div>
      <div class="weather-text" style="padding-right:72px">
        <div class="weather-title">未来3天有中到大雨</div>
        <div class="weather-desc">开封地区9月24-26日预计有持续降雨。露地瓜果烂掉风险增加约5个百分点。建议提前采收或优先卖给贩子。点击查看详细天气预报。</div>
      </div>
    </div>

    <!-- Selling Advice -->
    <div class="section-card" style="background:#5BAE8A;color:#fff">
      <div class="section-title" style="color:#fff">
        <svg viewBox="0 0 24 24" style="stroke:#F5A623"><path d="M12 2L2 7l10 5 10-5-10-5z"/><polyline points="2 17 12 22 22 17"/></svg>
        当前卖货建议
      </div>
      <div style="font-size:15px;line-height:1.8">
        <p style="margin-bottom:8px">现在是低谷，自己拉去市场卖，比全给贩子能多赚 <strong style="color:#F5A623">两成</strong> 左右。</p>
        <p style="margin-bottom:8px">未来3天有大雨，如果等得起，建议 <strong style="color:#F5A623">雨停后再卖</strong>，价格可能回升。</p>
        <p>要是怕烂地里，优先卖给附近收购点，图个省心。</p>
      </div>
    </div>

    <div class="data-source">数据来源：商务部市场运行监测、北京新发地市场官网<br>更新时间：2026年9月24日</div>
  </div>

  <div id="tab-bar">
    <a class="tab-item" href="index.html">
      <div class="tab-icon-wrap">
        <svg class="tab-icon" viewBox="0 0 24 24"><rect x="5" y="3" width="14" height="18" rx="2"/><line x1="8" y1="7" x2="16" y2="7"/><line x1="8" y1="11" x2="11" y2="11"/><line x1="14" y1="11" x2="16" y2="11"/><line x1="8" y1="15" x2="11" y2="15"/><line x1="14" y1="15" x2="16" y2="15"/></svg>
      </div>
      <div class="tab-label">算账</div>
    </a>
    <a class="tab-item active" href="market.html">
      <div class="tab-icon-wrap">
        <svg class="tab-icon" viewBox="0 0 24 24"><polyline points="22 12 18 12 15 21 9 3 6 12 2 12"/></svg>
      </div>
      <div class="tab-label">行情</div>
    </a>
    <a class="tab-item" href="service.html">
      <div class="tab-icon-wrap">
        <svg class="tab-icon" viewBox="0 0 24 24"><rect x="2" y="2" width="9" height="9" rx="1"/><rect x="13" y="2" width="9" height="9" rx="1"/><rect x="13" y="13" width="9" height="9" rx="1"/><rect x="2" y="13" width="9" height="9" rx="1"/></svg>
      </div>
      <div class="tab-label">服务</div>
    </a>
    <a class="tab-item" href="profile.html">
      <div class="tab-icon-wrap">
        <svg class="tab-icon" viewBox="0 0 24 24"><path d="M20 21v-2a4 4 0 00-4-4H8a4 4 0 00-4 4v2"/><circle cx="12" cy="7" r="4"/></svg>
      </div>
      <div class="tab-label">我的</div>
    </a>
  </div>
</div>

<script>
(function(){
  var PRICE_TYPES = [
    {id:'dealer', name:'贩子来收', color:'#5BAE8A', defaultPrice:0.30},
    {id:'market', name:'自己拉去市场', color:'#F5A623', defaultPrice:0.70},
    {id:'retail', name:'路边/集市卖', color:'#A8D5BA', defaultPrice:0.90},
    {id:'coop', name:'合作社/加工厂', color:'#7A8C83', defaultPrice:0.55}
  ];

  // Read all price history：优先读首页写入的 priceHistory（{date,dealer,market,retail,coop}），兼容旧格式
  function getPriceHistory() {
    var priceHistory = [];
    var raw = localStorage.getItem('priceHistory');
    try { priceHistory = JSON.parse(raw || '[]'); } catch(e) { priceHistory = []; }
    if (!Array.isArray(priceHistory)) priceHistory = [];
    var hasNew = priceHistory.some(function(r) { return r && r.date && r.dealer !== undefined; });
    if (hasNew) {
      var dates = [];
      priceHistory.forEach(function(r) { if (r && r.date && dates.indexOf(r.date) < 0) dates.push(r.date); });
      dates.sort();
      if (dates.length > 30) {
        var cutoff = dates[dates.length - 30];
        priceHistory = priceHistory.filter(function(r) { return r && r.date >= cutoff; });
      }
      return priceHistory;
    }
    // 兼容旧格式：fenhuobao_price_history = [{date,type,price}]
    var old = [];
    try { old = JSON.parse(localStorage.getItem('fenhuobao_price_history') || '[]'); } catch(e) { old = []; }
    if (Array.isArray(old) && old.length) {
      var map = {};
      old.forEach(function(r) {
        if (!r || !r.date) return;
        if (!map[r.date]) map[r.date] = {date: r.date, dealer: null, market: null, retail: null, coop: null};
        if (r.type === 'dealer') map[r.date].dealer = r.price;
        else if (r.type === 'market') map[r.date].market = r.price;
        else if (r.type === 'retail') map[r.date].retail = r.price;
        else if (r.type === 'factory') map[r.date].coop = r.price;
      });
      var keys = Object.keys(map).sort();
      var converted = [];
      for (var i = 0; i < keys.length; i++) converted.push(map[keys[i]]);
      return converted;
    }
    return [];
  }

  // Get latest dealer price from real data
  function getLatestDealerPrice() {
    var priceHistory = getPriceHistory();
    var recs = priceHistory.filter(function(r) { return r && r.date && r.dealer !== undefined && r.dealer !== null; });
    recs.sort(function(a,b) { return a.date.localeCompare(b.date); });
    if (recs.length > 0) return recs[recs.length-1].dealer;
    return PRICE_TYPES[0].defaultPrice;
  }

  // 历史记录不足 3 天时的模拟数据兜底（最近 7 天，走“越早略贵”的下行趋势）
  function buildMockHistory() {
    var base = getLatestDealerPrice() || 0.30;
    var coef = {market: 1.40, retail: 1.80, coop: 1.10};
    var arr = [];
    var today = new Date();
    function pad(n) { return n < 10 ? '0' + n : '' + n; }
    for (var i = 6; i >= 0; i--) {
      var d = new Date(today);
      d.setDate(d.getDate() - i);
      var dateStr = d.getFullYear() + '-' + pad(d.getMonth() + 1) + '-' + pad(d.getDate());
      var wave = 1 + i * 0.008 + (i % 2) * 0.004;
      var dealer = Math.round(base * wave * 100) / 100;
      arr.push({
        date: dateStr,
        dealer: dealer,
        market: Math.round(dealer * coef.market * 100) / 100,
        retail: Math.round(dealer * coef.retail * 100) / 100,
        coop: Math.round(dealer * coef.coop * 100) / 100
      });
    }
    return arr;
  }

  // Build display dates based on range
  function buildDisplayDates(range, allDates) {
    if (allDates.length === 0) {
      // No data, generate last 7 days
      var today = new Date();
      var dates = [];
      for (var i = 6; i >= 0; i--) {
        var d = new Date(today);
        d.setDate(d.getDate() - i);
        var mm = d.getMonth() + 1;
        var dd = d.getDate();
        dates.push(d.getFullYear() + '-' + (mm < 10 ? '0' + mm : mm) + '-' + (dd < 10 ? '0' + dd : dd));
      }
      return dates;
    }

    if (range === 'week') {
      return allDates.slice(-7);
    } else if (range === 'month') {
      return allDates.slice(-30);
    } else {
      // season: all dates
      return allDates;
    }
  }

  // Render chart for given range
  function renderChart(range) {
    var priceHistory = getPriceHistory();
    var usingMock = false;

    // 历史记录不足 3 天时用模拟数据兜底，并标注“近7天价格趋势（模拟）”
    var seenDates = {};
    var realDayCount = 0;
    priceHistory.forEach(function(r) { if (r && r.date && !seenDates[r.date]) { seenDates[r.date] = 1; realDayCount++; } });
    if (realDayCount < 3) {
      priceHistory = buildMockHistory();
      usingMock = true;
    }

    // Get all unique dates from history
    var allDates = [];
    priceHistory.forEach(function(rec) {
      if (rec && rec.date && allDates.indexOf(rec.date) < 0) allDates.push(rec.date);
    });
    allDates.sort();

    var displayDates = buildDisplayDates(range, allDates);

    // Build data for each type
    var chartData = {};
    var hasAnyRealData = false;
    var hasAnyPoint = false;
    var accumulatingTypes = [];

    PRICE_TYPES.forEach(function(pt) {
      // 新格式：同一天一条记录带四渠道价格（dealer/market/retail/coop）
      var typeRecords = priceHistory.filter(function(r) {
        return r && r.date && r[pt.id] !== undefined && r[pt.id] !== null;
      });
      var typeDates = [];
      typeRecords.forEach(function(r) { if (typeDates.indexOf(r.date) < 0) typeDates.push(r.date); });
      typeDates.sort();

      var hasEnoughData = typeDates.length >= 3;
      if (typeRecords.length > 0) hasAnyPoint = true;
      var dataPoints = [];

      displayDates.forEach(function(dateStr) {
        var rec = null;
        for (var i = 0; i < typeRecords.length; i++) {
          if (typeRecords[i].date === dateStr) { rec = typeRecords[i]; break; }
        }
        var parts = dateStr.split('-');
        var label = parseInt(parts[1], 10) + '/' + parseInt(parts[2], 10);
        dataPoints.push({
          label: label,
          value: rec ? rec[pt.id] : null,
          date: dateStr,
          real: !!rec
        });
      });

      if (hasEnoughData) hasAnyRealData = true;
      else accumulatingTypes.push(pt.name);

      chartData[pt.id] = {
        type: pt,
        data: dataPoints,
        hasEnoughData: hasEnoughData
      };
    });

    // Find all non-null values for chart scaling
    var allValues = [];
    Object.keys(chartData).forEach(function(key) {
      chartData[key].data.forEach(function(d) {
        if (d.value !== null) allValues.push(d.value);
      });
    });

    var maxV = -Infinity, minV = Infinity;
    allValues.forEach(function(v) {
      if (v > maxV) maxV = v;
      if (v < minV) minV = v;
    });

    if (maxV === -Infinity) { maxV = 1; minV = 0; }
    if (maxV === minV) { maxV += 0.5; minV = Math.max(0, minV - 0.5); }

    var rangeV = maxV - minV;
    var chartMin = Math.max(0, minV - rangeV * 0.15);
    var chartMax = maxV + rangeV * 0.15;

    // Find overall peak and low across all types with enough data
    var overallPeak = {value: -Infinity, typeId: '', idx: -1};
    var overallLow = {value: Infinity, typeId: '', idx: -1};

    Object.keys(chartData).forEach(function(key) {
      var cd = chartData[key];
      if (!cd.hasEnoughData) return;
      cd.data.forEach(function(d, i) {
        if (d.value !== null) {
          if (d.value > overallPeak.value) { overallPeak = {value: d.value, typeId: key, idx: i}; }
          if (d.value < overallLow.value) { overallLow = {value: d.value, typeId: key, idx: i}; }
        }
      });
    });

    // Current price = latest dealer price from real data
    var currentPrice = getLatestDealerPrice();

    // Update labels
    var priceChangeEl = document.getElementById('price-change');
    var sourceLabel;
    var rangeLabel = range === 'week' ? '近7天' : (range === 'month' ? '近30天' : '本季');
    if (usingMock) {
      sourceLabel = rangeLabel + '价格趋势（模拟）';
    } else if (accumulatingTypes.length > 0 && !hasAnyRealData) {
      sourceLabel = rangeLabel + '价格趋势（数据积累中）';
    } else if (accumulatingTypes.length > 0) {
      sourceLabel = rangeLabel + '价格趋势（部分类型数据积累中）';
    } else {
      sourceLabel = rangeLabel + '价格趋势（基于你的录入）';
    }
    priceChangeEl.textContent = sourceLabel;
    document.getElementById('price-now').textContent = currentPrice.toFixed(2);

    // Build SVG chart
    var chartWrap = document.getElementById('chart-wrap');
    var W = 320, H = 210, padL = 40, padR = 16, padT = 24, padB = 36;
    var plotW = W - padL - padR, plotH = H - padT - padB;

    var xStep, xCoord;
    if (displayDates.length > 1) {
      xStep = plotW / (displayDates.length - 1);
      xCoord = function(i) { return padL + i * xStep; };
    } else if (displayDates.length === 1) {
      xCoord = function(i) { return padL + plotW / 2; };
    } else {
      xCoord = function(i) { return W / 2; };
    }

    function yCoord(v) { return padT + plotH - (v - chartMin) / (chartMax - chartMin) * plotH; }

    var svg = '<svg class="chart-svg" viewBox="0 0 ' + W + ' ' + H + '" xmlns="http://www.w3.org/2000/svg">';

    // Grid lines
    for (var g = 0; g <= 5; g++) {
      var gy = padT + plotH * g / 5;
      var gv = (chartMax - (chartMax - chartMin) * g / 5).toFixed(1);
      svg += '<line x1="' + padL + '" y1="' + gy + '" x2="' + (W - padR) + '" y2="' + gy + '" stroke="#E8F0EB" stroke-width="1"/>';
      svg += '<text x="' + (padL - 6) + '" y="' + (gy + 3) + '" text-anchor="end" font-size="9" fill="#7A8C83">' + gv + '</text>';
    }

    // Draw each line: real data points always drawn; <3 days -> dashed line
    Object.keys(chartData).forEach(function(key) {
      var cd = chartData[key];
      var pt = cd.type;

      var validPoints = [];
      cd.data.forEach(function(d, i) {
        if (d.value !== null) validPoints.push({i: i, v: d.value});
      });

      if (validPoints.length > 1) {
        var linePath = 'M' + xCoord(validPoints[0].i) + ',' + yCoord(validPoints[0].v);
        for (var i = 1; i < validPoints.length; i++) {
          linePath += ' L' + xCoord(validPoints[i].i) + ',' + yCoord(validPoints[i].v);
        }
        var strokeDash = cd.hasEnoughData ? '' : ' stroke-dasharray="5,4"';
        svg += '<path d="' + linePath + '" fill="none" stroke="' + pt.color + '" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"' + strokeDash + '/>';
      }

      // Data points
      cd.data.forEach(function(d, i) {
        if (d.value === null) return;
        var cx = xCoord(i), cy = yCoord(d.value);
        var isPeak = (key === overallPeak.typeId && i === overallPeak.idx);
        var isLow = (key === overallLow.typeId && i === overallLow.idx);
        var r = (isPeak || isLow) ? 5 : 3;

        svg += '<circle cx="' + cx + '" cy="' + cy + '" r="' + r + '" fill="' + pt.color + '" stroke="#fff" stroke-width="1.5"/>';

        if (isPeak) {
          svg += '<text x="' + cx + '" y="' + (cy - 12) + '" text-anchor="middle" font-size="9" fill="' + pt.color + '" font-weight="600">\u6700\u8d35(' + pt.name + ')</text>';
        }
        if (isLow) {
          svg += '<text x="' + cx + '" y="' + (cy + 18) + '" text-anchor="middle" font-size="9" fill="' + pt.color + '" font-weight="600">\u6700\u4fbf\u5b9c(' + pt.name + ')</text>';
        }
      });
    });

    // X-axis labels
    for (var i = 0; i < displayDates.length; i++) {
      var parts = displayDates[i].split('-');
      var label = parseInt(parts[1], 10) + '/' + parseInt(parts[2], 10);
      svg += '<text x="' + xCoord(i) + '" y="' + (H - 10) + '" text-anchor="middle" font-size="9" fill="#7A8C83">' + label + '</text>';
    }

    // Empty state hint when no price recorded yet
    if (!hasAnyPoint) {
      svg += '<text x="' + (W / 2) + '" y="' + (H / 2) + '" text-anchor="middle" font-size="12" fill="#7A8C83">\u8fd8\u6ca1\u6709\u5f55\u5165\u4ef7\u683c\uff0c\u53bb\u9996\u9875\u8bb0\u5f55\u4e00\u4e0b\u5427</text>';
    }

    svg += '</svg>';
    chartWrap.innerHTML = svg;

    // Update legend
    var legendEl = document.getElementById('chart-legend');
    var legendHtml = '';
    PRICE_TYPES.forEach(function(pt) {
      var cd = chartData[pt.id];
      if (cd.hasEnoughData) {
        legendHtml += '<span><span class="legend-dot" style="background:' + pt.color + '"></span>' + pt.name + '</span>';
      } else {
        legendHtml += '<span><span class="legend-line" style="background:' + pt.color + ';border-top:2px dashed ' + pt.color + ';height:0"></span>' + pt.name + '\uff08\u6570\u636e\u79ef\u7d2f\u4e2d\uff09</span>';
      }
    });
    legendEl.innerHTML = legendHtml;

    // Price comparison card
    var todayStr = displayDates[displayDates.length - 1];
    var todayPrices = {};
    PRICE_TYPES.forEach(function(pt) {
      var cd = chartData[pt.id];
      var todayRec = null;
      for (var i = 0; i < cd.data.length; i++) {
        if (cd.data[i].date === todayStr) { todayRec = cd.data[i]; break; }
      }
      todayPrices[pt.id] = todayRec ? todayRec.value : pt.defaultPrice;
    });

    // Find min and max
    var priceList = PRICE_TYPES.map(function(pt) {
      return {id: pt.id, name: pt.name, price: todayPrices[pt.id], color: pt.color};
    });
    priceList.sort(function(a, b) { return a.price - b.price; });
    var minPrice = priceList[0].price;
    var maxPrice = priceList[priceList.length - 1].price;

    var cardHtml = '<div style="background:#fff;border-radius:16px;padding:20px;box-shadow:0 2px 12px rgba(91,174,138,0.08);margin-bottom:16px">' +
      '<div style="font-size:16px;font-weight:600;color:#1F2D28;margin-bottom:16px;display:flex;align-items:center;gap:8px">' +
      '<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#5BAE8A" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M12 20V10M18 20V4M6 20v-4"/></svg>' +
      '\u4eca\u65e5\u4ef7\u683c\u5bf9\u6bd4' +
      '</div>';

    priceList.forEach(function(p) {
      var isLowest = p.price === minPrice;
      var isHighest = p.price === maxPrice;
      var diff = p.price - minPrice;
      var extra = '';
      if (!isLowest) {
        extra = ' <span style="color:#7A8C83;font-size:12px">\uff08\u6bd4\u8d29\u5b50\u591a\u8d5a ' + diff.toFixed(2) + ' \u5143/\u65a4\uff09</span>';
      }
      var tag = '';
      if (isLowest) tag = ' <span style="font-size:11px;color:#fff;background:#E53935;padding:2px 8px;border-radius:10px">\u6700\u4f4e</span>';
      if (isHighest) tag = ' <span style="font-size:11px;color:#fff;background:#5BAE8A;padding:2px 8px;border-radius:10px">\u6700\u9ad8</span>';

      cardHtml += '<div style="display:flex;align-items:center;justify-content:space-between;padding:12px 0;border-bottom:1px solid #E8F0EB">' +
        '<div style="display:flex;align-items:center;gap:10px">' +
        '<span style="width:10px;height:10px;border-radius:50%;background:' + p.color + ';display:inline-block"></span>' +
        '<span style="font-size:14px;color:#1F2D28">' + p.name + '</span>' +
        '</div>' +
        '<div style="text-align:right">' +
        '<span style="font-size:18px;font-weight:700;color:' + p.color + '">' + p.price.toFixed(2) + '</span>' +
        '<span style="font-size:12px;color:#7A8C83"> \u5143/\u65a4</span>' + tag + extra +
        '</div>' +
        '</div>';
    });

    cardHtml += '</div>';
    document.getElementById('comparison-card').innerHTML = cardHtml;
  }

  // Tab switching
  var tabs = document.querySelectorAll('.chart-tab');
  tabs.forEach(function(tab) {
    tab.addEventListener('click', function() {
      tabs.forEach(function(t) { t.classList.remove('active'); });
      tab.classList.add('active');
      var range = tab.getAttribute('data-range');
      renderChart(range);
    });
  });

  // Initial render (week range)
  renderChart('week');
})();
</script>
</body>
</html>
